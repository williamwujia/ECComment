# Include these location blocks in the existing public server {} block.
# They preserve /TmallComment/ because Streamlit is started with baseUrlPath.

location = /TmallComment {
    return 308 /TmallComment/;
}

location /TmallComment/ {
    client_max_body_size 52m;
    client_body_timeout 15s;
    limit_conn tmall_comment_connection 3;
    limit_req zone=tmall_comment_request burst=20 nodelay;

    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
